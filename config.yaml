# Camera / Video Settings
video:
  source: "data/raw/traffic.mp4"
  fps: 30
  width: 1280
  height: 720

# Detection Settings
detection:
  model: "yolov8n.pt"
  confidence: 0.4
  vehicle_classes: [2, 3, 5, 7]  # car, motorcycle, bus, truck

helmet:
  model: "models/helmet.pt"
  confidence: 0.5
  check_classes: [3]  # motorcycle only

# Tracking Settings
tracking:
  max_disappeared: 30
  max_distance: 80

# Violation Settings
violation:
  stop_line_y: 300
  signal_interval: 10
  speed_limit: 50

# Temporal verification
# A condition must remain true for this many processed frames
# before the system records a red-light violation.
verification:
  min_frames: 3
  cooldown_frames: 30

# Output Settings
output:
  screenshots_dir: "output/screenshots"
  reports_dir: "output/reports"
  save_violations: true

# Dashboard Settings
dashboard:
  show_fps: true
  show_vehicle_count: true
  show_violation_count: true
  show_signal_state: true
  show_violation_log: true
